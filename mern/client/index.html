<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Keep in step with name in src/lib/store.js; pages set their own titles -->
    <title>Umar Collections</title>
    <!-- Keep the description in step with description in src/lib/store.js -->
    <meta
      name="description"
      content="Clothing, knitwear and bags for everyday wear from Umar Collections, Faisalabad. Delivery within Faisalabad, pay by bank transfer."
    />
    <meta name="theme-color" content="#fbf3e6" />
    <!-- Link previews on WhatsApp, Facebook and X. %SITE_URL% is filled in at
         build time (see vite.config.js), since previews need full addresses. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Umar Collections" />
    <meta property="og:title" content="Umar Collections" />
    <meta
      property="og:description"
      content="Clothing, knitwear and bags for everyday wear from Umar Collections, Faisalabad. Delivery within Faisalabad, pay by bank transfer."
    />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Umar Collections, clothing and bags from Faisalabad" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Montserrat:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
