<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The UC monogram in several sizes: favicon.ico for browser tabs, PNGs for
         Google Search (a multiple of 48px) and phone home screens -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fbf3e6" />
    <meta property="og:site_name" content="Umar Collections" />
    <meta property="og:locale" content="en_PK" />
    <!-- The home page's tags. On the live site the server swaps everything
         between page-meta and /page-meta for each page's own title,
         description, link preview and structured data
         (backend/src/controllers/seo/page.controller.js). Keep the title and
         description in step with backend/src/config/store.js.
         %SITE_URL% is filled in at build time (see vite.config.js), since
         link previews need full addresses. -->
    <!-- page-meta -->
    <title>Umar Collections: Clothing, Bags &amp; Shoes in Faisalabad</title>
    <meta
      name="description"
      content="Umar Collections is an online clothing store in Faisalabad. Shop shirts, trousers, knitwear, jackets, bags, shoes and accessories, delivered to your door."
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Umar Collections: Clothing, Bags &amp; Shoes in Faisalabad"
    />
    <meta
      property="og:description"
      content="Umar Collections is an online clothing store in Faisalabad. Shop shirts, trousers, knitwear, jackets, bags, shoes and accessories, delivered to your door."
    />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Umar Collections, clothing, bags and shoes in Faisalabad"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- /page-meta -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Montserrat:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
